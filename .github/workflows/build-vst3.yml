name: Build VST3 (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build plugin
        run: cmake --build build --config Release --target Farol_VST3 --parallel
      - name: Core tests
        run: |
          cmake --build build --config Release --target farol_core_tests
          ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Farol-VST3
          path: build/Farol_artefacts/Release/VST3/Farol.vst3
